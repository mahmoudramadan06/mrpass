[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrpass"
version = "4.0.0"
description = "Advanced OSINT & security analysis CLI: password strength, breach intel, phone/email OSINT, hash identification, audit wordlists"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mahmoud Ramadan Elbezzawy" }]
keywords = ["osint", "security", "password", "breach", "pentest", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "phonenumbers>=8.13",
]

[project.urls]
Repository = "https://github.com/mahmoudramadan06/mrpass"

[project.scripts]
mrpass = "mrpass:main"

[tool.setuptools]
py-modules = ["mrpass"]
